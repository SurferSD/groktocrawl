# Docker Build & Publish CI
#
# Builds and publishes Docker images for GroktoCrawl services to ghcr.io.
# Uses a build matrix with capped parallelism to avoid runner resource exhaustion.
#
# Performance optimizations:
#   - PRs push images to ghcr.io with PR tags → integration tests pull instead of rebuild
#   - QEMU removed (no ARM targets in build matrix)
#   - Health checks consolidated into single parallel step
#   - Path-filtered PR triggers skip docs-only changes
#
# Tags:
#   - main branch → latest, unstable, SHA
#   - PR branch    → pr-N (used by integration tests to avoid double-build)
#   - vX.Y.Z tag   → stable, X, X.Y, X.Y.Z

name: Docker Build & Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "skills/**"
      - ".github/**"
      - '!.github/workflows/docker.yml'

env:
  REGISTRY: ghcr.io
  REGISTRY_OWNER: groktopus

jobs:
  build-and-push:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: agent-svc
            context: .
            dockerfile: agent-svc/Dockerfile
            image: ghcr.io/groktopus/groktocrawl-agent
          - service: scraper-svc
            context: .
            dockerfile: scraper-svc/Dockerfile
            image: ghcr.io/groktopus/groktocrawl-scraper
          - service: browser-svc
            context: .
            dockerfile: browser-svc/Dockerfile
            image: ghcr.io/groktopus/groktocrawl-browser
          - service: semantic-svc
            context: .
            dockerfile: semantic-svc/Dockerfile
            image: ghcr.io/groktopus/groktocrawl-semantic
          - service: portal-svc
            context: .
            dockerfile: portal-svc/Dockerfile
            image: ghcr.io/groktopus/groktocrawl-portal
      max-parallel: 2

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=unstable,enable=${{ github.ref_name == 'main' }}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ github.sha }},enable=true
            type=ref,event=pr,enable=${{ github.event_name == 'pull_request' }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}}.{{patch}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{raw}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: HF_TOKEN=${{ secrets.HF_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune untagged versions
        if: github.event_name == 'push'
        shell: bash
        run: |
          PACKAGE_NAME=$(echo "${{ matrix.image }}" | sed 's|.*/||')
          echo "Pruning untagged versions of $PACKAGE_NAME"
          gh api \
            --method GET \
            "/orgs/${{ env.REGISTRY_OWNER }}/packages/container/$PACKAGE_NAME/versions?per_page=100" \
            --jq '.[] | select(.metadata.container.tags == null or .metadata.container.tags == []) | .id' \
            | while read version_id; do
              echo "  Deleting version $version_id"
              gh api --method DELETE \
                "/orgs/${{ env.REGISTRY_OWNER }}/packages/container/$PACKAGE_NAME/versions/$version_id" --silent
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration-tests:
    name: Integration Tests
    needs: build-and-push
    runs-on: [self-hosted, groktopus, docker]
    steps:
      - uses: actions/checkout@v7

      - name: Set up .env
        run: |
          cp .env.sample .env
          echo "LLM_BASE_URL=http://llm-svc:8011/v1" >> .env
          echo "LLM_MODEL=fixture-model" >> .env

      - name: Force-remove all stale project containers
        run: docker ps -a --filter name=groktocrawl -q | xargs -r docker rm -f || true

      - name: Clean up stale containers from previous run
        run: docker compose down --remove-orphans --timeout 30 || true

      - name: Pull pre-built images from ghcr.io
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAG="pr-${{ github.event.pull_request.number }}"
          else
            TAG="${{ github.sha }}"
          fi
          echo "Using image tag: $TAG"

          SERVICES="agent-svc scraper-svc browser-svc semantic-svc portal-svc"
          for svc in $SERVICES; do
            IMAGE="ghcr.io/groktopus/groktocrawl-$svc"
            echo "Pulling $IMAGE:$TAG"
            docker pull "$IMAGE:$TAG"
            # Retag as the image name so docker compose finds it without --build
            docker tag "$IMAGE:$TAG" "$IMAGE:latest"
          done

      - name: Start the Docker stack (pre-built images, no rebuild)
        run: docker compose up -d
        timeout-minutes: 5

      - name: Start test fixtures
        run: docker compose --profile fixture up --build -d llm-svc tier3-fixture test-site
        timeout-minutes: 5

      - name: Wait for all services to be healthy
        run: |
          python3 -c "
          import concurrent.futures, time, urllib.request, urllib.error, subprocess

          services = {
              'agent-svc':      ('http://localhost:8080/health', 180),
              'semantic-svc':   ('http://localhost:8003/health', 120),
              'tier3-fixture':  ('http://localhost:8006/health',  60),
              'test-site':      ('http://localhost:8005/health',  60),
          }

          def wait_service(name, url, timeout_s):
              deadline = time.time() + timeout_s
              while time.time() < deadline:
                  try:
                      r = urllib.request.urlopen(url, timeout=5)
                      if r.status == 200:
                          return f'{name} healthy'
                  except urllib.error.HTTPError as e:
                      pass
                  except Exception:
                      pass
                  time.sleep(2)
              raise RuntimeError(f'Timed out waiting for {name} at {url} ({timeout_s}s)')

          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
              futures = {ex.submit(wait_service, name, url, to): name for name, (url, to) in services.items()}
              for future in concurrent.futures.as_completed(futures):
                  print(future.result())

          # Verify Qdrant is reachable from inside agent-svc (where tests run)
          print('Verifying Qdrant connectivity from agent-svc...')
          deadline = time.time() + 60
          while time.time() < deadline:
              r = subprocess.run(
                  ['docker', 'compose', 'exec', '-T', 'agent-svc',
                   'python3', '-c',
                   'import urllib.request; u=urllib.request.urlopen(\"http://semantic-svc:8003/index/stats\", timeout=5); print(u.status)'],
                  capture_output=True, text=True, timeout=10
              )
              if r.returncode == 0 and '200' in r.stdout:
                  print('Qdrant reachable from agent-svc')
                  break
              time.sleep(4)
          else:
              raise RuntimeError('Timed out waiting for Qdrant from agent-svc')
          "

      - name: Copy test files and source directories
        run: |
          svc=$(docker compose ps -q agent-svc)
          docker compose exec -T agent-svc mkdir -p /app/tests
          docker cp tests/. "$svc":/app/tests/
          for pkg in agent-svc/agent scraper-svc/scraper parse-svc/parse_svc portal-svc/portal browser-svc/browser_svc search-svc/search_svc llm-svc/llm_svc; do
            docker compose exec -T agent-svc mkdir -p "/app/$pkg"
            docker cp "$pkg/." "$svc:/app/$pkg/"
          done

      - name: Run integration tests
        run: |
          docker compose exec -T \
            -e PYTHONPATH=/app/agent-svc:/app/scraper-svc:/app/search-svc:/app/llm-svc:/app/parse-svc:/app/portal-svc:/app/browser-svc:/app \
            -e SCRAPER_BASE_URL=http://scraper-svc:8001 \
            -e SEARCH_BASE_URL=http://slopsearx:8080 \
            -e LLM_BASE_URL=http://llm-svc:8011 \
            -e TEST_SITE_BASE_URL=http://test-site:8000 \
            -e TIER3_FIXTURE_BASE_URL=http://tier3-fixture:8000 \
            -e SEMANTIC_BASE_URL=http://semantic-svc:8003 \
            agent-svc python3 -m pytest /app/tests/ --timeout=120 --ignore-glob='*unit*' --ignore-glob='*observability*'
          docker compose exec -T \
            -e PYTHONPATH=/app/agent-svc:/app/scraper-svc:/app/search-svc:/app/llm-svc:/app/parse-svc:/app/portal-svc:/app/browser-svc:/app \
            -e SCRAPER_BASE_URL=http://scraper-svc:8001 \
            -e SEARCH_BASE_URL=http://slopsearx:8080 \
            -e LLM_BASE_URL=http://llm-svc:8011 \
            -e TEST_SITE_BASE_URL=http://test-site:8000 \
            -e TIER3_FIXTURE_BASE_URL=http://tier3-fixture:8000 \
            -e SEMANTIC_BASE_URL=http://semantic-svc:8003 \
            agent-svc python3 -m pytest /app/tests/ --timeout=120 --ignore-glob='*unit*' --ignore-glob='*observability*'
        timeout-minutes: 15

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --tail 50

      - name: Tear down stack
        if: always()
        run: docker compose down --remove-orphans --timeout 30
